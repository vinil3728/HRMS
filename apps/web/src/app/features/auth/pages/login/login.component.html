<div class="card login-card">
  <div class="login-header">
    <h1 class="login-title">Sign In</h1>
    <p class="login-subtitle">Enter your credentials to access the TreasureX portal</p>
  </div>

  @if (errorMessage()) {
    <div class="alert alert-error">
      <app-icon name="close" [size]="16" customClass="alert-icon"></app-icon>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <div class="form-group">
      <label for="username" class="form-label">Username</label>
      <div class="input-icon-wrapper">
        <app-icon name="users" [size]="16" customClass="icon-left"></app-icon>
        <input
          id="username"
          type="text"
          class="form-control"
          placeholder="e.g. admin"
          formControlName="username"
          [class.is-invalid]="isFieldInvalid('username')"
        />
      </div>
      @if (isFieldInvalid('username')) {
        <span class="form-error">Username is required</span>
      }
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Password</label>
      <div class="input-icon-wrapper">
        <app-icon name="shield" [size]="16" customClass="icon-left"></app-icon>
        <input
          id="password"
          type="password"
          class="form-control"
          placeholder="••••••••••••"
          formControlName="password"
          [class.is-invalid]="isFieldInvalid('password')"
        />
      </div>
      @if (isFieldInvalid('password')) {
        <span class="form-error">Password is required</span>
      }
    </div>

    <button
      type="submit"
      class="btn btn-primary w-full submit-btn"
      [disabled]="isLoading() || loginForm.invalid"
    >
      @if (isLoading()) {
        <span class="spinner"></span>
        <span>Signing in...</span>
      } @else {
        <span>Sign In</span>
      }
    </button>
  </form>

  <!-- Quick Test Helper -->
  <div class="demo-helper">
    <div class="helper-text">Testing credentials:</div>
    <button
      type="button"
      class="btn btn-outline btn-sm demo-btn"
      (click)="fillDemoAdmin()"
    >
      Fill Demo Admin (admin)
    </button>
  </div>
</div>
