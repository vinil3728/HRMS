<div class="placeholder-container">
  <div class="card placeholder-card">
    <div class="icon-wrap">
      <app-icon name="shield" [size]="40" [strokeWidth]="1.5"></app-icon>
    </div>
    <h2 class="placeholder-title">{{ pageTitle }}</h2>
    <p class="placeholder-desc">
      Foundation setup complete. This feature is staged for implementation following your confirmation.
    </p>
    <div class="status-wrap">
      <app-badge variant="info">Phase: Foundation Ready</app-badge>
    </div>
  </div>
</div>
