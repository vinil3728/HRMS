@if (isOpen()) {
  <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="regularize-title">
    <button class="modal-backdrop" (click)="onCancel()" aria-label="Close backdrop"></button>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 id="regularize-title" class="modal-title">Attendance Regularization</h3>
          <p class="modal-subtitle">
            Request manual punch adjustment or missed clock-in/out correction for manager review.
          </p>
        </div>
        <button class="close-btn" (click)="onCancel()" aria-label="Close modal">
          <app-icon name="close" [size]="20"></app-icon>
        </button>
      </div>

      @if (errorMessage()) {
        <div class="alert-error" role="alert">
          <app-icon name="shield" [size]="16"></app-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
        <div class="form-group">
          <label class="form-label">
            Date to Regularize <span class="required">*</span>
          </label>
          <app-date-picker
            formControlName="attendanceDate"
            mode="single"
            [fullWidth]="true"
            placeholder="Select attendance date"
          ></app-date-picker>
          @if (isFieldInvalid('attendanceDate')) {
            <span class="field-error">Please select an attendance date</span>
          }
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="regCheckIn">
              Correct Check-In Time
            </label>
            <input
              id="regCheckIn"
              type="time"
              class="form-control"
              formControlName="requestedCheckIn"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="regCheckOut">
              Correct Check-Out Time
            </label>
            <input
              id="regCheckOut"
              type="time"
              class="form-control"
              formControlName="requestedCheckOut"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            Reason / Justification <span class="required">*</span>
          </label>
          <app-select
            formControlName="reasonCategory"
            [options]="reasonCategoryOptions"
            [fullWidth]="true"
          ></app-select>
        </div>

        <div class="form-group">
          <label class="form-label" for="regNotes">
            Additional Details (Optional)
          </label>
          <textarea
            id="regNotes"
            class="form-control textarea"
            rows="3"
            placeholder="Provide context, client name, or explanation for your supervisor"
            formControlName="reasonNotes"
          ></textarea>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="onCancel()"
            [disabled]="submitting()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="submitting() || form.invalid"
          >
            @if (submitting()) {
              <span class="spinner" aria-hidden="true"></span>
              <span>Submitting...</span>
            } @else {
              <span>Submit Request</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
